include:
  - docker-compose.stack.yml

services:
  zoomeet:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      # Browser WebRTC uses this URL; use wss:// and your public LiveKit hostname in production.
      - PUBLIC_LIVEKIT_URL=${PUBLIC_LIVEKIT_URL}
    depends_on:
      - livekit
    networks:
      - default
      - dokploy-network
